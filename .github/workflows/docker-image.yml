name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Release a new version
        id: release
        run: |
          git fetch --tags
          HIGHEST=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$HIGHEST" ]; then
            VERSION="${HIGHEST%.*}.$(( ${HIGHEST##*.} + 1 ))"
          else
            VERSION=0.1.0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          export VERSION=${{ steps.release.outputs.version }}
          export TAG=ghcr.io/${GITHUB_REPOSITORY@L}/assistant:$VERSION
          export LATEST_TAG=ghcr.io/${GITHUB_REPOSITORY@L}/assistant:latest
          docker build . -f assistant/Dockerfile -t $TAG
          docker push $TAG
          docker image tag $TAG $LATEST_TAG 
          docker push $LATEST_TAG
